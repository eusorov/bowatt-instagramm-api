services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bowatt-instagramm-api
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DB:-instagramm}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-bowatt}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-password}
      - JWT_SECRET=${JWT_SECRET:-change-me-use-at-least-32-bytes-for-hs256-dev-only!!}
      - APP_STORAGE_UPLOAD_DIR=/app/uploads

    volumes:
      - app-uploads:/app/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: bowatt-instagramm-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-instagramm}
      MYSQL_USER: ${MYSQL_USER:-bowatt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - instagramm-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  instagramm-mysql-data:
  app-uploads: