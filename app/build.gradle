buildscript { 
	repositories {
		mavenCentral()
	}
	dependencies {
		// Same Flyway line as Spring Boot 4.0.5 (see ./gradlew dependencyInsight --dependency flyway-core).
		classpath 'org.flywaydb:flyway-core:11.14.1'

	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
	id 'net.ltgt.errorprone' version '5.1.0' // https://github.com/tbroyer/gradle-errorprone-plugin
}

group = 'com.bowatt.instagramm.api'
version = '0.0.1-SNAPSHOT'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'

	// Match flyway-core version from Spring Boot 4.0.5 (see ./gradlew dependencyInsight --dependency flyway-core).
	implementation 'org.flywaydb:flyway-mysql:11.14.1'
	runtimeOnly 'com.mysql:mysql-connector-j'

	implementation platform('io.github.resilience4j:resilience4j-bom:2.4.0')
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
 
	// OpenAPI 3 + Swagger UI (/v3/api-docs, /v3/api-docs.yaml, /swagger-ui.html)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

	implementation 'net.datafaker:datafaker:2.4.2'

	// Fast restarts on classpath changes in local dev; excluded from bootJar (not for production)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	errorprone 'com.google.errorprone:error_prone_core:2.49.0' // https://github.com/google/error-prone
    errorprone 'com.uber.nullaway:nullaway:0.13.4' // https://github.com/uber/NullAway

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	//testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    mainClass = 'com.bowatt.instagramm.api.InstagrammApiApplication'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        option('NullAway:AnnotatedPackages', 'com.bowatt.instagramm.api')
    }
}
