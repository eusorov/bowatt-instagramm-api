spring:
  application:
    name: bowatt-instagramm-api
  datasource:
    url: jdbc:mysql://localhost:3306/instagramm?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: bowatt
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  mvc:
    trailing-slash-match: true
    apiversion:
      default: "1.00"
      use:
        header: API-Version
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  cache:
    type: caffeine
    cache-names: tags,images,image
    caffeine:
      # Without recordStats, Micrometer only registers cache.size (not cache.gets).
      spec: recordStats

app:
  storage:
    upload-dir: uploads
    upload-path: /images
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://insta.usomi.de
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

server:
  base-url: http://localhost
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging.level:
  org.hibernate.SQL: INFO
  org.springframework.cache: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,caches
  metrics:
    enable:
      cache: true
