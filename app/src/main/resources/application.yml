spring:
  application:
    name: bowatt-instagramm-api
  datasource:
    url: jdbc:mysql://localhost:3306/instagramm?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: bowatt
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  mvc:
    trailing-slash-match: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

app:
  storage:
    upload-dir: uploads
    upload-path: /images
  

server:
  base-url: http://localhost
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
